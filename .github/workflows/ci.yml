name: CI

on:
  pull_request:
  push:
    branches: [not-run]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Bundle size check (30 KB gz cap)
        run: npm run size

      - name: Parse-time bench (fail on +15% regression)
        run: npm run parse-bench

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright F1 smoke
        run: npm run e2e

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate commit messages
        run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }}
