name: Release

on:
  push:
    branches:
      - main
      - rc

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release → GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@nayan9229"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Bundle size check
        run: npm run size

      - name: Compute SRI hashes
        run: npm run sri

      - name: Parse-time bench (fail on +15% regression)
        run: npm run parse-bench

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Purge jsDelivr cache (best-effort)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MAJOR=${PKG_VERSION%%.*}
          MINOR=${PKG_VERSION%.*}
          # Consumers load via the GitHub source (/gh/, tag = v<version>), not /npm/
          # (the package is on GitHub Packages, which jsDelivr does not serve). Purge
          # every /gh/ alias — exact tag plus the moving latest/major/minor aliases —
          # for both bundles, or @latest keeps serving a stale build.
          for FILE in pubads.mini.js pubads.mini.esm.js; do
            for REF in "v${PKG_VERSION}" "latest" "${MAJOR}" "${MINOR}"; do
              curl -sf "https://purge.jsdelivr.net/gh/nayan9229/ads@${REF}/dist/${FILE}" || true
            done
          done
