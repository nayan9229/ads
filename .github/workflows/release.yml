name: Release

on:
  push:
    branches:
      - main
      - rc

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release → GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: "https://npm.pkg.github.com"
          scope: "@nayan9229"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + integration tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Bundle size check
        run: npm run size

      - name: Compute SRI hashes
        run: npm run sri

      - name: Parse-time bench (fail on +15% regression)
        run: npm run parse-bench

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Purge jsDelivr cache (best-effort)
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          curl -sf "https://purge.jsdelivr.net/npm/@nayan9229/ads@${PKG_VERSION}/dist/pubads.mini.js" || true
          curl -sf "https://purge.jsdelivr.net/npm/@nayan9229/ads@1/dist/pubads.mini.js" || true
